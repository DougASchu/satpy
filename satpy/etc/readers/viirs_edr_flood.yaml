reader:
    name: viirs_edr_flood
    short_name: VIIRS flood
    long_name: VIIRS EDR Flood data in NetCDF4 format
    description: VIIRS flood NetCDF4 reader
    supports_fsspec: false
    reader: !!python/name:satpy.readers.core.yaml_reader.FileYAMLReader
    sensors: [viirs]

file_types:
    viirs_edr:
        file_reader: !!python/name:satpy.readers.viirs_edr_flood.VIIRSEDRFlood
        file_patterns:
            - '{prefix:?}VIIRS-Flood-{aoi}_{version}_{platform_shortname}_s{start_time}_e{end_time}_c{creation_time}.nc'

datasets:
    water_detection:
        name: 'WaterDetection'
        file_type: viirs_edr
        coordinates: [longitude, latitude]

    longitude:
        name: 'longitude'
        file_key: 'lon'
        file_type: viirs_edr
        standard_name: 'longitude'
        units: 'degrees_east'

    latitude:
        name: 'latitude'
        file_key: 'lat'
        file_type: viirs_edr
        standard_name: 'latitude'
        units: 'degrees_north'
